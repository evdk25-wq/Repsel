name: Publish Repsel

on:
  push:
    tags:
      - "v*"

permissions:
  checks: write
  contents: write
  id-token: write
  attestations: write

jobs:
  release-linux:
    name: Build Linux packages
    runs-on: ubuntu-22.04
    environment: release

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libappindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri

      - name: Run frontend tests
        run: npm test

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Verify release tag
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

      - name: Build and publish Repsel
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Repsel ${{ github.ref_name }}
          releaseBody: |
            Repsel for Linux.

            Download the Debian package or the portable AppImage below.
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          args: --bundles deb,appimage
          releaseAssetNamePattern: Repsel_[version]_[arch][ext]

      - name: Import release signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.REPSEL_GPG_PRIVATE_KEY }}
        run: |
          install -d -m 700 "${RUNNER_TEMP}/repsel-gnupg"
          printf '%s' "${GPG_PRIVATE_KEY}" | gpg \
            --batch \
            --homedir "${RUNNER_TEMP}/repsel-gnupg" \
            --import

      - name: Create checksums and signatures
        env:
          GPG_PASSPHRASE: ${{ secrets.REPSEL_GPG_PASSPHRASE }}
        working-directory: src-tauri/target/release/bundle
        run: |
          mapfile -t artifacts < <(find deb appimage -maxdepth 1 -type f \( -name '*.deb' -o -name '*.AppImage' \) -printf '%p\n' | sort)
          test "${#artifacts[@]}" -eq 2
          : > SHA256SUMS
          for artifact in "${artifacts[@]}"; do
            checksum="$(sha256sum "${artifact}" | cut -d ' ' -f 1)"
            printf '%s  %s\n' "${checksum}" "$(basename "${artifact}")" >> SHA256SUMS
          done
          for artifact in "${artifacts[@]}" SHA256SUMS; do
            gpg \
              --batch \
              --yes \
              --pinentry-mode loopback \
              --passphrase "${GPG_PASSPHRASE}" \
              --homedir "${RUNNER_TEMP}/repsel-gnupg" \
              --armor \
              --detach-sign "${artifact}"
          done

      - name: Upload checksums and signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: src-tauri/target/release/bundle
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            SHA256SUMS \
            SHA256SUMS.asc \
            deb/*.deb.asc \
            appimage/*.AppImage.asc \
            --clobber

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/SHA256SUMS
