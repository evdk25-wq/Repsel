[package]
name = "repsel"
version = "1.0.0"
description = "A focused Markdown editor for Linux"
authors = ["Repsel contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "repsel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
